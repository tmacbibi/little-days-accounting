name: Update Taiwan market data

on:
  workflow_dispatch:
  schedule:
    # Asia/Taipei: 15:50 and 17:20, Monday-Friday.
    # Two runs give the official closing files time to settle and provide a same-day retry.
    - cron: '50 7 * * 1-5'
    - cron: '20 9 * * 1-5'
  push:
    paths:
      - 'scripts/update-market-data.mjs'
      - '.github/workflows/update-market-data.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test parser
        run: node scripts/test-market-data.mjs

      - name: Fetch TWSE and TPEx data
        run: node scripts/update-market-data.mjs

      - name: Commit updated static data
        run: |
          if git diff --quiet -- data/security-master.json data/latest-quotes.json; then
            echo "No market-data changes."
            exit 0
          fi
          git config user.name "little-days-market-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/security-master.json data/latest-quotes.json
          git commit -m "chore: update Taiwan market data"
          git push
