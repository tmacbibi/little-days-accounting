name: Wave official daily data
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9,10 * * 1-5'
  push:
    paths:
      - wave-data/collect_official.py
      - .github/workflows/update-wave-official.yml
permissions:
  contents: write
concurrency:
  group: wave-official-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Collect and validate official TPEx data
        run: python3 wave-data/collect_official.py
      - name: Commit verified data only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add wave-data/latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update verified wave official data"
          git pull --rebase origin main
          git push origin HEAD:main
